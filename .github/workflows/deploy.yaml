# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yaml"
      - "Dockerfile"
      - "fly.toml"
      - "src/scripts/**"
      - "src/services/**"
      - "files/**"
  workflow_run:
    workflows:
      - Auto-merge
    types:
      - completed
jobs:
  fly-config-validate:
    name: Validate Fly.io config
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate config
        run: flyctl config validate  --app ${{ secrets.APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Docker files with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
  deploy:
    name: Deploy app on Fly.io
    runs-on: ubuntu-latest
    needs:
      - fly-config-validate
      - dockerfile-lint
    env:
      HORUST_UNRARFS_CONFIG: |
        ${{ secrets.HORUST_UNRAR_CONFIG }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app ${{ secrets.APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
